<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="clockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#clockBg)"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3"/>
  <circle cx="50" cy="50" r="34" fill="#0f172a" />
  <!-- Hour tick marks -->
  <line x1="50" y1="20" x2="50" y2="25" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="75" y2="50" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="50" y2="75" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="50" x2="25" y2="50" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Clock hands at 10:10 -->
  <line x1="50" y1="50" x2="35" y2="35" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="68" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Second hand -->
  <line x1="50" y1="56" x2="50" y2="23" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center cap -->
  <circle cx="50" cy="50" r="3" fill="#f43f5e"/>
</svg>
